<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-metalmax-local'; style-src 'unsafe-inline'; img-src 'self' metalmaxart: https://shared.fastly.steamstatic.com https://cdn.cloudflare.steamstatic.com https://cdn.akamai.steamstatic.com https://steamcdn-a.akamaihd.net https://cdn1.epicgames.com; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Playmelt</title>
    <style>
      :root {
        --ink: #171b1f;
        --muted: #5c6570;
        --line: #44576620;
        --accent: #234e70;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        font-size: 13px;
        color: var(--ink);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(130deg, #f9fafbea, #dbe0e5e8);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      button,
      input,
      select {
        outline: none;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #3673a4;
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .titlebar {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #69727b;
        letter-spacing: 0.02em;
        user-select: none;
      }
      .app {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        height: calc(100vh - 36px);
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 26px 16px 20px;
        border-right: 1px solid var(--line);
        background: #edf0f340;
        gap: 28px;
      }
      .brand {
        padding: 0 9px;
        font-size: 25px;
        font-weight: 720;
        letter-spacing: -1px;
      }
      .brand {
        padding: 0;
      }
      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav-button {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 11px;
        min-height: 39px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        text-align: left;
        font-size: 12px;
        font-weight: 540;
      }
      .nav-button:hover {
        background: #ffffff50;
      }
      .nav-button[aria-current="page"] {
        background: linear-gradient(#ffffffb5, #ffffff65);
        border-color: #ffffffb8;
        box-shadow: 0 2px 7px #2634410b;
      }
      .nav-count {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .nav-separator {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 16px 9px;
      }
      .side-account {
        margin-top: auto;
        padding: 0 3px;
      }
      .account-select {
        width: 100%;
        padding: 8px 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #ffffff65;
        font-size: 12px;
        font-weight: 550;
      }
      .account-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 9px;
        font-size: 10px;
        color: var(--muted);
      }
      .text-button {
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 10px;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .toolbar {
        padding: 27px 30px 19px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .toolbar h1 {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.8px;
        margin: 0;
        line-height: 1.2;
      }
      .toolbar-actions {
        display: flex;
        gap: 8px;
      }
      .button {
        border: 1px solid #7a8b9a42;
        background: linear-gradient(#ffffffd4, #ffffff65);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 550;
        min-height: 34px;
        white-space: nowrap;
        box-shadow: 0 1px 2px #15283c06;
      }
      .button:hover:not(:disabled) {
        background: #fff;
        border-color: #738b9e80;
      }
      .button.secondary {
        background: transparent;
        box-shadow: none;
      }
      .button.primary {
        background: #263b4c;
        color: #fff;
        border-color: #263b4c;
      }
      .button.primary:hover:not(:disabled) {
        background: #1a2e3e;
      }
      .filters {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 30px 22px;
      }
      .search {
        flex: 1;
        min-width: 120px;
      }
      .search input {
        width: 100%;
        background: #ffffff70;
        border: 1px solid #64788b2b;
        border-radius: 9px;
        padding: 10px 13px;
        font-size: 12px;
      }
      .search input::placeholder {
        color: #67727e;
      }
      .filter-select {
        border: 0;
        background: transparent;
        padding: 7px 18px 7px 6px;
        font-size: 12px;
        max-width: 170px;
      }
      .library-pane {
        padding: 3px 30px 30px;
        min-height: 0;
        overflow: auto;
        flex: 1;
      }
      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 23px 18px;
      }
      .game-card {
        display: block;
        position: relative;
        aspect-ratio: 2/3;
        overflow: hidden;
        border: 1px solid #ffffffac;
        border-radius: 12px;
        background: #aeb7bf;
        box-shadow: 0 4px 13px #24374b1c;
        padding: 0;
        text-align: left;
        color: #fff;
        isolation: isolate;
      }
      .game-art {
        position: absolute;
        inset: 0;
        background: #aeb7bf;
        overflow: hidden;
      }
      .game-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .game-card:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          #00000021 0%,
          transparent 33%,
          #07101915 53%,
          #071019c9 82%,
          #071019ee 100%
        );
        z-index: 1;
        pointer-events: none;
      }
      .game-card:hover,
      .game-card:focus-within {
        box-shadow: 0 6px 20px #24374b30;
        border-color: #fff;
      }
      .card-open {
        position: absolute;
        inset: 0;
        z-index: 2;
        padding: 0;
        border: 0;
        background: transparent;
        border-radius: 12px;
      }
      .card-open:hover {
        background: transparent;
      }
      .game-card:focus-within {
        outline: 3px solid #3673a4;
        outline-offset: 3px;
      }
      .card-open:focus-visible {
        outline: none;
      }
      .game-copy,
      .store-badge {
        pointer-events: none;
      }
      .game-action {
        pointer-events: auto;
        border: 0;
      }
      .store-badge {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 2;
        font-size: 10px;
        line-height: 1;
        letter-spacing: 0.01em;
        font-weight: 550;
        padding: 6px 8px;
        border-radius: 5px;
        background: #101b26b8;
        color: #fff;
        border: 1px solid #ffffff30;
      }
      .game-copy {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 15px;
        z-index: 2;
        display: block;
      }
      .game-title {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 16px;
        font-weight: 650;
        line-height: 1.23;
        letter-spacing: -0.3px;
        text-shadow: 0 1px 6px #0005;
      }
      .game-platforms {
        display: block;
        font-size: 11px;
        font-weight: 450;
        color: #f5f7f9d1;
        margin-top: 7px;
      }
      .game-action {
        display: inline-block;
        margin-top: 12px;
        padding: 7px 11px;
        border-radius: 6px;
        background: #fff;
        color: #1c2c39;
        font-size: 11px;
        font-weight: 650;
        opacity: 0;
        transform: translateY(3px);
        transition:
          opacity 0.12s ease,
          transform 0.12s ease;
      }
      .game-card:hover .game-action,
      .game-card:focus-within .game-action {
        opacity: 1;
        transform: none;
      }
      .game-card:not(:hover):not(:focus-within) .game-copy {
        bottom: -19px;
      }
      .game-copy {
        transition: bottom 0.12s ease;
      }
      .empty {
        max-width: 380px;
        margin: 80px auto;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }
      .empty h2 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.3px;
        color: var(--ink);
        margin: 0 0 12px;
      }
      .load-more {
        display: block;
        margin: 28px auto 0;
      }
      .toast {
        position: fixed;
        left: calc(50% + 75px);
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 20;
        max-width: 560px;
        display: flex;
        gap: 18px;
        align-items: flex-start;
        background: #f7f9fbf7;
        border: 1px solid #a6b6c3;
        border-radius: 10px;
        box-shadow: 0 6px 24px #23374b30;
        padding: 13px 17px;
        font-size: 12px;
        line-height: 1.5;
      }
      .toast.error {
        border-color: #ab8a63;
      }
      .toast-close {
        border: 0;
        background: none;
        padding: 0 1px;
        color: #5b6771;
        font-size: 14px;
      }
      .game-dialog {
        width: 360px;
        max-width: calc(100vw - 40px);
        padding: 25px;
        border: 1px solid #ffffffdb;
        border-radius: 16px;
        background: linear-gradient(130deg, #f8fafb, #e2e7ec);
        box-shadow: 0 20px 80px #081a2e40;
        color: var(--ink);
      }
      .game-dialog::backdrop {
        background: #10223352;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .dialog-close {
        position: absolute;
        right: 15px;
        top: 12px;
        border: 0;
        background: transparent;
        font-size: 22px;
        color: #5c6c79;
        padding: 3px 5px;
      }
      .dialog-store {
        font-size: 11px;
        color: var(--muted);
        margin: 0 28px 9px 0;
      }
      .game-dialog h2 {
        font-size: 23px;
        font-weight: 630;
        letter-spacing: -0.6px;
        line-height: 1.2;
        margin: 0 0 22px;
      }
      .dialog-label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .route-select {
        width: 100%;
        border: 1px solid #60778c38;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff8c;
        font-size: 12px;
        margin-bottom: 12px;
      }
      .dialog-action {
        width: 100%;
      }
      .setup-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        margin: 0 0 12px;
      }
      .setup-progress {
        width: 100%;
        height: 6px;
        display: block;
        accent-color: #344e63;
        margin: 0 0 15px;
      }
      .setup-cancel {
        width: 100%;
        margin-top: 7px;
      }
      .dialog-note {
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
        margin: 12px 0 0;
      }
      .diagnostics {
        padding: 3px 30px 30px;
        min-height: 0;
        overflow: auto;
        flex: 1;
      }
      .diagnostic-panel {
        border: 1px solid #ffffffb8;
        border-radius: 13px;
        background: #ffffff50;
        padding: 24px;
        margin: 0 0 18px;
      }
      .diagnostic-panel h2 {
        font-size: 17px;
        font-weight: 620;
        letter-spacing: -0.3px;
        margin: 0 0 21px;
      }
      .hardware-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px 28px;
        margin: 0;
      }
      .fact dt {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .fact dd {
        font-size: 21px;
        font-weight: 550;
        letter-spacing: -0.4px;
        margin: 0;
      }
      .fact dd.compact {
        font-size: 13px;
        line-height: 1.5;
        letter-spacing: 0;
      }
      .diagnostic-note {
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
        margin: 20px 0 0;
      }
      .runtime-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .runtime-row:first-child {
        padding-top: 0;
      }
      .runtime-row:last-child {
        padding-bottom: 0;
        border: 0;
      }
      .runtime-row span:last-child {
        color: var(--muted);
      }
      .diagnostic-list {
        padding-left: 18px;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
      }
      .diagnostic-list li + li {
        margin-top: 7px;
      }
      @media (max-width: 1100px) {
        .app {
          grid-template-columns: 170px minmax(0, 1fr);
        }
        .sidebar {
          padding-left: 12px;
          padding-right: 12px;
        }
        .brand {
          font-size: 24px;
        }
        .toolbar {
          padding: 24px 24px 18px;
        }
        .filters {
          padding: 0 24px 20px;
        }
        .library-pane,
        .diagnostics {
          padding-left: 24px;
          padding-right: 24px;
        }
        .game-grid {
          grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 18px 15px;
        }
        .game-title {
          font-size: 15px;
        }
        .filter-select {
          max-width: 145px;
        }
      }
      @media (max-width: 800px) {
        .app {
          grid-template-columns: 145px minmax(0, 1fr);
        }
        .sidebar {
          padding: 23px 10px 18px;
        }
        .brand {
          font-size: 21px;
          padding-left: 5px;
        }
        .nav-button {
          font-size: 11px;
          padding: 9px 7px;
        }
        .nav-count {
          font-size: 10px;
        }
        .toolbar {
          padding: 23px 18px 17px;
          gap: 10px;
        }
        .toolbar h1 {
          font-size: 24px;
        }
        .toolbar-actions .button {
          font-size: 10px;
          padding: 8px 9px;
        }
        .filters {
          padding: 0 18px 18px;
          gap: 5px;
          flex-wrap: wrap;
        }
        .search {
          flex-basis: 100%;
        }
        .library-pane,
        .diagnostics {
          padding-left: 18px;
          padding-right: 18px;
        }
        .game-grid {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 17px 13px;
        }
        .game-title {
          font-size: 14px;
        }
        .game-copy {
          left: 11px;
          right: 11px;
        }
        .store-badge {
          left: 10px;
          top: 10px;
          font-size: 9px;
        }
        .hardware-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .account-select {
          font-size: 10px;
          padding: 7px 4px;
        }
        .account-line {
          font-size: 9px;
          flex-wrap: wrap;
        }
      }
      @media (max-width: 560px) {
        .app {
          grid-template-columns: 125px minmax(0, 1fr);
        }
        .brand {
          font-size: 20px;
        }
        .sidebar {
          padding-left: 8px;
          padding-right: 8px;
        }
        .toolbar {
          align-items: flex-start;
          gap: 8px;
          padding: 19px 14px 15px;
        }
        .toolbar h1 {
          font-size: 21px;
        }
        .toolbar-actions {
          flex-direction: column;
          gap: 5px;
        }
        .filters {
          padding: 0 14px 15px;
        }
        .filter-select {
          font-size: 10px;
          max-width: 130px;
        }
        .library-pane,
        .diagnostics {
          padding-left: 14px;
          padding-right: 14px;
        }
        .game-grid {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 15px 11px;
        }
        .game-title {
          font-size: 13px;
        }
        .game-platforms {
          font-size: 10px;
        }
        .hardware-grid {
          grid-template-columns: 1fr;
        }
        .toast {
          max-width: calc(100vw - 150px);
          left: calc(50% + 55px);
        }
      }
      @media (hover: none) {
        .game-action {
          opacity: 1;
          transform: none;
        }
        .game-card:not(:hover):not(:focus-within) .game-copy {
          bottom: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
          scroll-behavior: auto !important;
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        body {
          background: #edf0f3;
        }
        .sidebar {
          background: #e5e9ed;
        }
        .diagnostic-panel {
          background: #f8fafb;
        }
        .game-dialog::backdrop {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar">Playmelt</div>
    <div class="app">
      <aside class="sidebar" aria-label="Navigation principale">
        <div class="brand">
          <img
            src="PlaymeltLogo.png"
            alt="Playmelt"
            width="2172"
            height="724"
          />
        </div>
        <nav class="nav">
          <button class="nav-button" data-view="library" aria-current="page">
            <span>Bibliothèque</span
            ><span class="nav-count" id="countAll">—</span></button
          ><button class="nav-button" data-view="steam">
            <span>Steam</span
            ><span class="nav-count" id="countSteam">—</span></button
          ><button class="nav-button" data-view="epic">
            <span>Epic Games</span
            ><span class="nav-count" id="countEpic">—</span>
          </button>
          <hr class="nav-separator" />
          <button class="nav-button" data-view="diagnostics">
            <span>État du Mac</span>
          </button>
        </nav>
        <div class="side-account">
          <select
            class="account-select"
            id="accountSelect"
            aria-label="Compte Steam"
            disabled
          >
            <option>Steam</option>
          </select>
          <div class="account-line">
            <span id="accountStatus">À synchroniser</span
            ><button class="text-button" id="steamLogin">Connexion</button>
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="toolbar">
          <h1 id="viewTitle">Bibliothèque</h1>
          <div class="toolbar-actions">
            <button class="button" id="installJobButton" hidden>
              Installation</button
            ><button class="button secondary" id="refresh">Actualiser</button
            ><button class="button" id="syncLibrary" disabled>
              Synchroniser</button
            ><button class="button secondary" id="openEpic" hidden>
              Ouvrir Epic Games</button
            ><button class="button" id="epicAction" hidden>
              Connecter Epic
            </button>
          </div>
        </header>
        <div class="filters" id="filters">
          <div class="search">
            <input
              type="search"
              id="search"
              placeholder="Rechercher un jeu"
              aria-label="Rechercher un jeu"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <select
            class="filter-select"
            id="installFilter"
            aria-label="Filtrer par installation"
          >
            <option value="all">Tous les jeux</option>
            <option value="installed">Installés</option>
            <option value="not-installed">Non installés</option></select
          ><select
            class="filter-select"
            id="platformFilter"
            aria-label="Filtrer par plateforme"
          >
            <option value="all">Mac & Windows</option>
            <option value="mac">Mac</option>
            <option value="windows">Windows</option>
          </select>
        </div>
        <section
          class="library-pane"
          id="libraryPane"
          aria-label="Bibliothèque de jeux"
        >
          <div class="game-grid" id="gameGrid" aria-label="Jeux"></div>
          <div class="empty" id="empty">
            <h2 id="emptyTitle">Chargement…</h2>
          </div>
          <button class="button load-more" id="loadMore" hidden>
            Afficher davantage
          </button>
        </section>
        <section
          class="diagnostics"
          id="diagnostics"
          aria-label="État du Mac"
          hidden
        ></section>
      </main>
    </div>
    <dialog class="game-dialog" id="gameDialog" aria-labelledby="dialogTitle">
      <button class="dialog-close" id="dialogClose" aria-label="Fermer">
        ×
      </button>
      <p class="dialog-store" id="dialogStore"></p>
      <h2 id="dialogTitle"></h2>
      <div id="dialogBody"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toastMessage"></span
      ><button
        class="toast-close"
        id="toastClose"
        aria-label="Fermer la notification"
      >
        ×
      </button>
    </div>

            ),
            fact(
              "Swap utilisé",
              typeof h.swapUsedGB === "number"
                ? `${locale.format(h.swapUsedGB)} Go`
                : "Indisponible",
            ),
            fact("Graphismes", h.gpuName || "Indisponible", true),
            fact(
              "Économie d’énergie",
              typeof h.lowPowerMode === "boolean"
                ? h.lowPowerMode
                  ? "Activée"
                  : "Désactivée"
                : "Indisponible",
              true,
            ),
            fact(
              "État thermique",
              {
                nominal: "Normal",
                fair: "Modéré",
                serious: "Élevé",
                critical: "Critique",
              }[h.thermalState] ||
                h.thermalState ||
                "Indisponible",
              true,
            ),
          );
          top.append(
            grid,
            el(
              "p",
              "diagnostic-note",
              "Le volume de swap ne mesure pas la pression mémoire instantanée.",
            ),
          );
          panel.append(top);
          const runtimes = el("section", "diagnostic-panel");
          runtimes.append(el("h2", "", "Clients & environnements"));
          for (const runtime of state.runtimes) {
            const row = el("div", "runtime-row");
            row.append(
              el("span", "", runtime.name),
              el("span", "", runtime.available ? "Disponible" : "Absent"),
            );
            runtimes.append(row);
          }
          panel.append(runtimes);
          if (state.warnings.length) {
            const warnings = el("section", "diagnostic-panel");
            warnings.append(el("h2", "", "À vérifier"));
            const list = el("ul", "diagnostic-list");
            state.warnings.forEach((w) =>
              list.append(
                el("li", "", typeof w === "string" ? w : w.message || ""),
              ),
            );
            warnings.append(list);
            panel.append(warnings);
          }
          const sync = el("section", "diagnostic-panel");
          sync.append(
            el("h2", "", "Steam"),
            el(
              "p",
              "diagnostic-note",
              state.libraryStatus.message || "Aucune synchronisation.",
            ),
          );
          if (state.libraryStatus.updatedAt) {
            const date = new Date(state.libraryStatus.updatedAt);
            if (!Number.isNaN(date.getTime()))
              sync.append(
                el("p", "diagnostic-note", date.toLocaleString("fr-FR")),
              );
          }
          panel.append(sync);
        }
        function render() {
          updateSidebar();
          updateToolbar();
          if (ui.view === "diagnostics") renderDiagnostics();
          else renderLibrary();
        }
        window.onNativeState = (incoming) => {
          if (!incoming || typeof incoming !== "object") return;
          const nextGames = Array.isArray(incoming.games)
            ? incoming.games.map(normalizedGame).filter((g) => g.id)
            : state.games;
          const signature = JSON.stringify(nextGames);
          const libraryChanged = !received || signature !== lastGamesSignature;
          lastGamesSignature = signature;
          state = {
            ...state,
            ...incoming,
            accounts: Array.isArray(incoming.accounts)
              ? incoming.accounts
              : state.accounts,
            games: nextGames,
            runtimes: Array.isArray(incoming.runtimes)
              ? incoming.runtimes
              : state.runtimes,
            hardware: incoming.hardware || state.hardware,
            warnings: Array.isArray(incoming.warnings)
              ? incoming.warnings
              : state.warnings,
            epic: incoming.epic || state.epic,
            libraryStatus: incoming.libraryStatus || state.libraryStatus,
          };
          received = true;
          updateSidebar();
          updateToolbar();
          if (ui.view === "diagnostics") renderDiagnostics();
          else if (libraryChanged) renderLibrary();
          updateJobIndicator();
          refreshVisibleDialog();
        };
        window.onNativeRuntime = (snapshot) => {
          if (!snapshot || typeof snapshot !== "object") return;
          state.windowsRuntime = snapshot;
          refreshVisibleDialog();
        };
        window.onNativeInstallJob = (job) => {
          if (job !== null && (!job || typeof job !== "object")) return;
          state.installJob = job;
          updateJobIndicator();
          refreshVisibleDialog();
        };
        window.onNativeResult = (result) => {
          if (result && typeof result === "object")
            notify(
              String(result.message || "Action terminée."),
              result.ok === false,
            );
        };
        document.querySelectorAll("[data-view]").forEach((button) =>
          button.addEventListener("click", () => {
            ui.view = button.dataset.view;
            ui.limit = 48;
            updateToolbar();
            if (ui.view === "diagnostics") renderDiagnostics();
            else renderLibrary();
          }),
        );
        $("search").addEventListener("input", (event) => {
          ui.query = event.target.value.trim().toLocaleLowerCase("fr");
          ui.limit = 48;
          renderLibrary();
        });
        $("installFilter").addEventListener("change", (event) => {
          ui.install = event.target.value;
          ui.limit = 48;
          renderLibrary();
        });
        $("platformFilter").addEventListener("change", (event) => {
          ui.platform = event.target.value;
          ui.limit = 48;
          renderLibrary();
        });
        $("accountSelect").addEventListener("change", (event) =>
          send("selectAccount", { accountId: event.target.value }),
        );
        $("refresh").addEventListener("click", () => {
          lastGamesSignature = "";
          gameCardCache.clear();
          send("refresh");
        });
        $("installJobButton").addEventListener("click", () => {
          const game = state.games.find(
            (g) => g.id === state.installJob?.gameId,
          );
          if (game) openGame(game);
        });
        $("syncLibrary").addEventListener("click", () => send("syncLibrary"));
        $("openEpic").addEventListener("click", () => send("openEpic"));
        $("epicAction").addEventListener("click", () =>
          send(state.epic.authenticated ? "syncEpic" : "connectEpic"),
        );
        $("steamLogin").addEventListener("click", () => send("openSteamLogin"));
        $("loadMore").addEventListener("click", () => {
          ui.limit += 48;
          renderLibrary();
        });
        $("toastClose").addEventListener("click", () => {
          $("toast").hidden = true;
          clearTimeout(toastTimer);
        });
        $("gameDialog").addEventListener("close", () => {
          ui.dialogProgress = null;
        });
        $("dialogClose").addEventListener("click", () =>
          $("gameDialog").close(),
        );
        $("gameDialog").addEventListener("click", (event) => {
          if (event.target === $("gameDialog")) {
            const r = $("gameDialog").getBoundingClientRect();
            if (
              event.clientX < r.left ||
              event.clientX > r.right ||
              event.clientY < r.top ||
              event.clientY > r.bottom
            )
              $("gameDialog").close();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (
            (event.metaKey || event.ctrlKey) &&
            event.key.toLowerCase() === "f" &&
            ui.view !== "diagnostics"
          ) {
            event.preventDefault();
            $("search").focus();
          }
          if (event.key === "Escape") $("toast").hidden = true;
        });
        render();
        send("refresh");
      })();
    </script>
  </body>
</html>
