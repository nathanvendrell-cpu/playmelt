        discover = window.PlaymeltDiscover.create({labelDate:relDate,send,openCloud:()=>send("openXbox"),el,getState:()=>state,getFeed:()=>hub.feed,artFor:pageArtFor,rank:window.PlaymeltExperience.rank,openGame:(game)=>{experience.close();openGame(game);},openLink:(url)=>{experience.close();openHubLink(url);},setBackground:(game)=>experience.setBackground(game)});
        $("bigPictureButton").addEventListener("click", () => experience.open());
        window.onNativeState = (incoming) => {
          if (!incoming || typeof incoming !== "object") return;
          const nextGames = Array.isArray(incoming.games)
            ? incoming.games.map(normalizedGame).filter((g) => g.id)
            : state.games;
          const signature = JSON.stringify(nextGames);
          const libraryChanged = !received || signature !== lastGamesSignature;
          lastGamesSignature = signature;
          state = {
            ...state,
            ...incoming,
            accounts: Array.isArray(incoming.accounts)
              ? incoming.accounts
              : state.accounts,
            games: nextGames,
            runtimes: Array.isArray(incoming.runtimes)
              ? incoming.runtimes
              : state.runtimes,
            hardware: incoming.hardware || state.hardware,
            warnings: Array.isArray(incoming.warnings)
              ? incoming.warnings
              : state.warnings,
            epic: incoming.epic || state.epic,
            libraryStatus: incoming.libraryStatus || state.libraryStatus,
          };
          if ($("subscriptionDialog").open) openSubscription();
          accountLogin.sync(state.account);
          if (typeof incoming.renderProtectionEnabled === "boolean")
            ui.pendingRenderProtection = null;
          if (!received) [400, 3000, 9000].forEach((ms) => setTimeout(() => send("checkServices"), ms));
          received = true;
          if (typeof setTimeout === "function" && window.PlaymeltBadges) {
            clearTimeout(ui.badgeTimer);
            ui.badgeTimer = setTimeout(() => window.PlaymeltBadges.check(state, { onOpen: () => goView("profile") }), 6000);
          }
          updateSidebar();
          updateToolbar();
          if (ui.view === "diagnostics") renderDiagnostics();
          else if (libraryChanged) { renderLibrary(); if ((["home", "news", "offers", "profile"].includes(ui.view)) && typeof renderHub === "function") renderHub(); }
          if (libraryChanged && state.games.length && typeof requestHub === "function") requestHub();
          updateJobIndicator();
          refreshVisibleDialog();
          if (incoming.gameSettings) renderGameSettings(incoming.gameSettings);
          experience.sync();
          appIntro.after(()=>onboarding.suggest());
          if (ui.view === "profile") renderHub();
        };
        window.onGameAchievements = (payload) => {
          if (!payload || !payload.achievements) return;
          const known = state.games.find((g) => g.id === payload.gameId);
          if (known) known.achievements = payload.achievements;
          if (known && ui.dialogGameId === known.id && $("gameDialog")?.open) {
            const stat = $("dialogStats")?.querySelector(".page-stat-ach b");
            if (stat) stat.replaceChildren(achievementNode(payload.achievements));
          }
          const container = $("dialogAchievementsContainer");
          if (container && (ui.dialogGameId === payload.gameId || (state.games.find((g) => g.id === ui.dialogGameId)?.appId === payload.appId))) {
            renderAchievementsSection(container, payload.achievements);
          }
        };
        window.onNativeRuntime = (snapshot) => {
          if (!snapshot || typeof snapshot !== "object") return;
          state.windowsRuntime = snapshot;
          if (typeof releaseFreshInstallActions === "function") releaseFreshInstallActions();
          if (ui.view === "diagnostics") {
            updateD3DMetalSettings();
            updateWindowsSettings();
          }
          refreshVisibleDialog();
        };
        let lastNotifiedJobPhase = "";
        window.onNativeInstallJobs = (snapshot) => {
          if (!snapshot || !Array.isArray(snapshot.jobs)) return;
          state.installJobs = snapshot.jobs;
          updateJobIndicator();
          refreshVisibleDialog();
        };
        window.onNativeInstallJob = (job) => {
          if (job !== null && (!job || typeof job !== "object")) return;
          const previous = state.installJob;
          state.installJob = job;
          if (Array.isArray(state.installJobs)) {
            state.installJobs = state.installJobs.filter(item => item.observed === true || item.store === "gog" ||
              (!previous || installationJobKey(item) !== installationJobKey(previous)) && (!job || installationJobKey(item) !== installationJobKey(job)));
            if (job) state.installJobs.push(job);
          }
          if (typeof releaseFreshInstallActions === "function") releaseFreshInstallActions();
          if (job) {
            const phase = jobPhase(job);
            if (phase !== lastNotifiedJobPhase) {
              lastNotifiedJobPhase = phase;
              if (typeof showToast === "function") {
                if (phase === "Téléchargement") {
                  showToast("Téléchargement de " + (job.title || "jeu") + " en cours…");
                } else if (phase === "Installation") {
                  showToast("Installation des fichiers de " + (job.title || "jeu") + "…");
                } else if (phase === "Vérification") {
                  showToast("Vérification des fichiers de " + (job.title || "jeu") + "…");
                } else if (job.status === "files-prepared") {
                  showToast("Fichiers de " + (job.title || "jeu") + " préparés. La préparation du lancement reste à terminer.");
                } else if (job.status === "launch-ready") {
                  const game = state.games.find(g => g.id === job.gameId);
                  showToast(game?.canLaunch === true && !String(game.launchBlockReason || "").trim() ?
                    (job.title || "Le jeu") + " est installé. Tu peux jouer." :
                    "Fichiers de " + (job.title || "jeu") + " préparés. La préparation du lancement reste à terminer.");
                }
              }
            }
          } else {
            lastNotifiedJobPhase = "";
          }
          if (ui.view === "diagnostics") {
            updateD3DMetalSettings();
            updateWindowsSettings();
          }
          updateJobIndicator();
          refreshVisibleDialog();
        };
        window.onNativeResult = (result) => {
          if (result?.ok === false && typeof releaseFreshInstallActions === "function") releaseFreshInstallActions();
          if (
            result?.ok === false &&
            typeof ui.pendingRenderProtection === "boolean"
          ) {
            ui.pendingRenderProtection = null;
            updateToolbar();
            updateJobIndicator();
            if (ui.view === "diagnostics") renderDiagnostics();
            refreshVisibleDialog();
          }
          if (result && typeof result === "object")
            restoreD3DMetalImportControls();
          if (result && typeof result === "object")
            notify(
              String(result.message || "Action terminée."),
              result.ok === false,
            );
        };
        document.querySelectorAll("[data-view]").forEach((button) =>
          button.addEventListener("click", () => openView(button.dataset.view)),
        );
        function openView(view) {
          {
            ui.view = view;
            $("hubPane").scrollTop=0; $("libraryPane").scrollTop=0;
            ui.limit = 48;
            if ($("gameDialog").open) $("gameDialog").close();
            updateToolbar();
            // Chaque ouverture de la vue Xbox garantit un catalogue à jour (silencieux si frais).
            if (ui.view === "xbox") send("checkXbox");
            if (ui.view === "diagnostics") renderDiagnostics();
            else if (ui.view === "installManager") renderInstallManager();
            else if (["home", "news", "offers", "profile"].includes(ui.view) || isServiceView()) { renderHub(); requestHub(); if (isServiceView()) send("checkServices"); }
            else renderLibrary();
          }
        }
        function updateLayoutToggle() {
          const t = $("layoutToggle");
          if (!t) return;
          t.hidden = ui.view !== "library";
          $("layoutListBtn").classList.toggle("active", ui.listMode === "list");
          $("layoutGridBtn").classList.toggle("active", ui.listMode === "grid");
        }
        $("layoutListBtn").addEventListener("click", () => {
          ui.listMode = "list";
          try { localStorage.setItem("playmelt_layout", "list"); } catch {}
          updateLayoutToggle();
          renderLibrary();
        });
        $("layoutGridBtn").addEventListener("click", () => {
          ui.listMode = "grid";
          try { localStorage.setItem("playmelt_layout", "grid"); } catch {}
          updateLayoutToggle();
          renderLibrary();
        });
        document.querySelectorAll(".freq-pill").forEach((button) => {
          button.addEventListener("click", () => {
            document.querySelectorAll(".freq-pill").forEach((b) => b.classList.remove("active"));
            button.classList.add("active");
            ui.recentFrequency = button.dataset.freq;
            renderLibrary();
          });
        });
        $("search").addEventListener("input", (event) => {
          ui.query = event.target.value.trim().toLocaleLowerCase("fr");
          ui.limit = 48;
          if ((["home", "news", "offers", "profile"].includes(ui.view)) && ui.query) { ui.view = "library"; updateToolbar(); }
          renderLibrary();
        });
        $("installFilter").addEventListener("change", (event) => {
          ui.install = event.target.value;
          ui.limit = 48;
          renderLibrary();
        });
        $("platformFilter").addEventListener("change", (event) => {
          ui.platform = event.target.value;
          ui.limit = 48;
          renderLibrary();
        });
        $("accountSelect").addEventListener("change", (event) =>
          send("selectAccount", { accountId: event.target.value }),
        );
        $("refresh").addEventListener("click", () => {
          lastGamesSignature = "";
          ui.artworkGeneration += 1;
          send("refresh");
          if (["home", "news", "offers", "profile"].includes(ui.view)) requestHub(true);
        });
        $("installJobButton").addEventListener("click", () => {
          ui.view = "installManager";
          updateToolbar();
          renderInstallManager();
        });
        // Xbox Platform Handlers
        $("xboxPlugPlayBtn")?.addEventListener("click", () => {
          if (state.xbox?.authenticated) {
            send("launchXboxCloud", { url: "https://www.xbox.com/fr-FR/play" });
          } else {
            send("launchXboxCloud", { url: "https://www.xbox.com/auth/msa?action=logIn&returnUrl=https%3A%2F%2Fwww.xbox.com%2Ffr-FR%2Fplay" });
          }
        });
        $("xboxDisconnectBtn")?.addEventListener("click", () => send("disconnectXbox"));
        $("xboxOpenCloudBtn")?.addEventListener("click", () =>
          send("launchXboxCloud", { url: "https://www.xbox.com/fr-FR/play" })
        );
        $("xboxSyncBtn")?.addEventListener("click", () => send("syncXbox"));
        ["all", "cloud", "pc"].forEach((sub) => {
          const btn = $(`xboxFilter${sub.charAt(0).toUpperCase() + sub.slice(1)}`);
          btn?.addEventListener("click", () => {
            ui.xboxFilter = sub;
            document.querySelectorAll("[data-xbox-filter]").forEach((b) => b.classList.toggle("active", b.dataset.xboxFilter === sub));
            renderLibrary();
          });
        });

        // Steam Platform Handlers
        $("steamPlugPlayBtn")?.addEventListener("click", () => send("openSteamLogin"));
        $("steamOpenBtn")?.addEventListener("click", () => send("openSteam"));
        $("steamSyncBtn")?.addEventListener("click", () => send("syncLibrary"));
        ["all", "mac", "installed"].forEach((sub) => {
          const btn = $(`steamFilter${sub.charAt(0).toUpperCase() + sub.slice(1)}`);
          btn?.addEventListener("click", () => {
            ui.steamFilter = sub;
            document.querySelectorAll("[data-steam-filter]").forEach((b) => b.classList.toggle("active", b.dataset.steamFilter === sub));
            renderLibrary();
          });
        });

        // Epic Platform Handlers
        $("epicPlugPlayBtn")?.addEventListener("click", () =>
          send(state.epic.authenticated ? "syncEpic" : "connectEpic")
        );
        $("epicOpenBtn")?.addEventListener("click", () => openHubLink("https://store.epicgames.com/fr/"));
        $("epicSyncBtn")?.addEventListener("click", () => send("syncEpic"));
        $("epicDisconnectBtn")?.addEventListener("click", () => {
          if (ui.view === "epic" && epicSessionPresent() && state.epic.busy !== true) send("disconnectEpic");
        });
        ["all", "installed"].forEach((sub) => {
          const btn = $(`epicFilter${sub.charAt(0).toUpperCase() + sub.slice(1)}`);
          btn?.addEventListener("click", () => {
            ui.epicFilter = sub;
            document.querySelectorAll("[data-epic-filter]").forEach((b) => b.classList.toggle("active", b.dataset.epicFilter === sub));
            renderLibrary();
          });

          btn?.addEventListener("click", () => {
            ui.gogFilter = sub;
            document.querySelectorAll("[data-gog-filter]").forEach((b) => b.classList.toggle("active", b.dataset.gogFilter === sub));
            renderLibrary();
          });

        // Local Platform Handlers

          lastGamesSignature = "";

        $("syncLibrary")?.addEventListener("click", () => send("syncLibrary"));

          send("launchXboxCloud", { url: "https://www.xbox.com/play" }),
        );

        $("epicAction")?.addEventListener("click", () =>
          send(state.epic.authenticated ? "syncEpic" : "connectEpic"),
        );
        $("disconnectEpic")?.addEventListener("click", () => {
          if (ui.view === "epic" && epicSessionPresent() && state.epic.busy !== true)
            send("disconnectEpic");
        });
        $("steamLogin")?.addEventListener("click", () => send("openSteamLogin"));
        $("loadMore").addEventListener("click", () => {
          ui.limit += 48;
          renderLibrary();
        });
        $("toastMinimize").addEventListener("click", toggleToastNotification);
        $("toastClose").addEventListener("click", dismissToastNotification);
        $("gameDialog").addEventListener("close", () => {
          ui.dialogProgress = null;
          gameMedia?.hide();
        });
        $("gameSettingsClose").addEventListener("click", () => $("gameSettingsDialog").close());

          const opener = ui.gameSettings?.opener;
          ui.gameSettings = null;
          refreshVisibleDialog();
          if (opener?.isConnected) opener.focus();
        });
        $("dialogClose").addEventListener("click", () =>
          $("gameDialog").close(),
        );
        document.addEventListener("keydown", (event) => {
          if (event.key !== "Escape" || !$("gameDialog").open) return;
          if ($("gameSettingsDialog").open || $("subscriptionDialog").open) return;
          $("gameDialog").close();
        });
        $("gameDialog").addEventListener("click", (event) => {
          if (event.target === $("gameDialog")) {
            const r = $("gameDialog").getBoundingClientRect();
            if (
              event.clientX < r.left ||
              event.clientX > r.right ||
              event.clientY < r.top ||
              event.clientY > r.bottom
            )
              $("gameDialog").close();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (
            (event.metaKey || event.ctrlKey) &&
            event.key.toLowerCase() === "f" &&
            ui.view !== "diagnostics"
          ) {
            event.preventDefault();
            $("search").focus();
          }
          if (event.key === "Escape") $("toast").hidden = true;
        });
        function setupSidebarAccordion() {
          const nav = $("sidebarNav");
          if (!nav) return;

          // 1. Restore order from localStorage
          try {
            const savedOrder = JSON.parse(localStorage.getItem("playmelt_nav_order") || "[]");
            if (Array.isArray(savedOrder) && savedOrder.length) {
              savedOrder.forEach((secId) => {
                const sec = nav.querySelector(`.nav-section[data-section-id="${secId}"]`);
                if (sec) nav.appendChild(sec);
              });
            }
          } catch {}

          // 2. Restore collapsed states
          try {
            const savedCollapsed = JSON.parse(localStorage.getItem("playmelt_nav_collapsed") || "{}");
            if (savedCollapsed && typeof savedCollapsed === "object") {
              Object.keys(savedCollapsed).forEach((secId) => {
                const sec = nav.querySelector(`.nav-section[data-section-id="${secId}"]`);
                if (sec && savedCollapsed[secId]) sec.classList.add("collapsed");
              });
            }
          } catch {}

          function saveOrder() {
            const order = [];
            nav.querySelectorAll(".nav-section").forEach((sec) => {
              const id = sec.getAttribute("data-section-id");
              if (id) order.push(id);
            });
            try {
              localStorage.setItem("playmelt_nav_order", JSON.stringify(order));
            } catch {}
          }

          function saveCollapsed() {
            const stateObj = {};
            nav.querySelectorAll(".nav-section").forEach((sec) => {
              const id = sec.getAttribute("data-section-id");
              if (id) stateObj[id] = sec.classList.contains("collapsed");
            });
            try {
              localStorage.setItem("playmelt_nav_collapsed", JSON.stringify(stateObj));
            } catch {}
          }

          // 3. Attach event listeners
          nav.querySelectorAll(".nav-section").forEach((sec) => {
            const header = sec.querySelector(".nav-section-header");
            header?.addEventListener("click", (e) => {
              if (e.target.closest(".nav-move-btn")) return;
              sec.classList.toggle("collapsed");
              saveCollapsed();
            });

            sec.querySelectorAll(".nav-move-btn").forEach((btn) => {
              btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const dir = btn.dataset.move;
                if (dir === "up" && sec.previousElementSibling) {
                  nav.insertBefore(sec, sec.previousElementSibling);
                } else if (dir === "down" && sec.nextElementSibling) {
                  nav.insertBefore(sec.nextElementSibling, sec);
                }
                saveOrder();
              });
            });
          });
        }

        // v2 : barre latérale fixe, sans sections repliables ni réordonnables.
        render();
        send("refresh");
      })();
    </script>
