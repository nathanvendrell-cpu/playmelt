          card.title = game.title;
          const artBox = el("div", "continue-art");
          const img = el("img");
          img.alt = game.title;
          const src = game.imageURL || game.customImageURL || game.localImageURL || game.portraitURL || game.localPortraitURL;
          if (src) img.src = src;
          img.loading = "lazy";
          artBox.append(img);
          const copy = el("div", "continue-copy");
          copy.append(el("span", "continue-title", game.title));
          const metaParts = [];
          if (game.playtimeFormatted && game.playtimeFormatted !== "Jamais joué") metaParts.push(game.playtimeFormatted);
          metaParts.push(pfOf(game)[0]);
          copy.append(el("span", "continue-meta", metaParts.join(" · ")));
          card.append(artBox, copy);
          if (game.canLaunch) {
            const cp = el("span", "continue-play");
            cp.innerHTML = ICON.play + "<span>Jouer</span>";
            card.append(cp);
          }
          card.addEventListener("click", () => {
            if (game.canLaunch && send("launchGame", { gameId: game.id })) return;
            openGame(game);
          });
          return card;
        }

          if (ui.view === "library") {
            push("Continuer à jouer",
              all.filter((g) => g.installed && g.lastPlayed > 0)
                 .sort((a, b) => b.lastPlayed - a.lastPlayed).slice(0, 14),
              "continue", "Installés sur ce Mac");

            if (ui.listMode !== "list")
              push("Vos jeux installés",
                all.filter((g) => g.installed).slice(0, 24),
                "poster", "", true);
          }

            wrap.append(head, scroll);
            box.append(wrap);

        function settingsMetrics(settings, capabilities) {
          const display = settings?.display || {};
          const graphics = settings?.graphics || {};
          if (!capabilities?.display || !capabilities?.graphics) return null;
          const width = Number(display.width), height = Number(display.height);
          if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) return null;
          const output = Math.round(width * height);
          const render = graphics.upscaler === 'fsr' && graphics.quality === 'quality'
            ? Math.round(width * 2 / 3) * Math.round(height * 2 / 3) : null;
          const target = Number(graphics.dynamicFPS);
          return { output, render, budget: target > 0 ? 1000 / target : null, target };
        }
        function metricCard(title, badge, value, detail) {
          const card = el('div', 'settings-metric');

          label.append(el('span', 'settings-badge', badge));
          const number = el('div', 'settings-metric-value', value);
          const note = el('div', 'settings-metric-detail', detail);
          card.append(label, number, note);
          return { card, number, note };
        }
        function updateSettingsMetrics(session) {
          if (!session.pixelMetric) return;
          const metrics = settingsMetrics(session.draft, session.capabilities);
          session.pixelMetric.number.textContent = metrics?.render != null ? metrics.render.toLocaleString('fr-FR') : '—';
          session.pixelMetric.note.textContent = metrics?.render != null
            ? `FSR Qualité théorique · ${metrics.output.toLocaleString('fr-FR')} pixels affichés${metrics.target > 0 ? ' · rendu dynamique variable' : ''}`

        function installJobFor(game) {

          if (job?.phase) return job.phase;
          return (
            {
              requesting: "Demande envoyée",
              "awaiting-steam": "En attente de Steam",
              downloading: "Téléchargement",
              paused: "En pause",
              validating: "Vérification",
              installing: "Installation",

              "launch-requested": "Lancement demandé",
              "launch-ready": "Prêt à jouer",
              failed: "Installation échouée",
              cancelled: "Suivi arrêté",
              "timed-out": "Suivi expiré",
            }[job?.status] || "Installation"
          );
        }
        function jobRatio(job) {
          if (typeof job?.progress === "number" && Number.isFinite(job.progress) && job.progress >= 0) {
            return Math.max(0, Math.min(1, job.progress));
          }
          return ["downloading", "paused", "installing", "validating"].includes(job?.status) &&
            typeof job?.bytesDownloaded === "number" &&
            Number.isFinite(job.bytesDownloaded) &&
            job.bytesDownloaded >= 0 &&
            typeof job?.bytesTotal === "number" &&
            Number.isFinite(job.bytesTotal) &&
            job.bytesTotal > 0
            ? Math.max(0, Math.min(1, job.bytesDownloaded / job.bytesTotal))
            : null;

          patchInstallProgress(job);
          if (job.status === "launch-ready") {

          send(state.epic.authenticated ? "syncEpic" : "connectEpic"),
        );
        $("disconnectEpic")?.addEventListener("click", () => {
          if (ui.view === "epic" && epicSessionPresent() && state.epic.busy !== true)
            send("disconnectEpic");
        });
        $("steamLogin")?.addEventListener("click", () => send("openSteamLogin"));
        $("loadMore").addEventListener("click", () => {
          ui.limit += 48;
          renderLibrary();
        });
        $("toastClose").addEventListener("click", () => {
          $("toast").hidden = true;
          clearTimeout(toastTimer);
        });
        $("gameDialog").addEventListener("close", () => {
          ui.dialogProgress = null;
        });
        $("gameSettingsClose").addEventListener("click", () => $("gameSettingsDialog").close());
        $("gameSettingsDialog").addEventListener("close", () => {
          const opener = ui.gameSettings?.opener;
          ui.gameSettings = null;
          if (opener?.isConnected) opener.focus();
        });
        $("dialogClose").addEventListener("click", () =>
          $("gameDialog").close(),
        );
        document.addEventListener("keydown", (event) => {
          if (event.key !== "Escape" || !$("gameDialog").open) return;
          if ($("gameSettingsDialog").open || $("subscriptionDialog").open) return;
          $("gameDialog").close();
        });
        $("gameDialog").addEventListener("click", (event) => {
          if (event.target === $("gameDialog")) {
            const r = $("gameDialog").getBoundingClientRect();
            if (
              event.clientX < r.left ||
              event.clientX > r.right ||
              event.clientY < r.top ||
              event.clientY > r.bottom
            )
              $("gameDialog").close();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (
            (event.metaKey || event.ctrlKey) &&
            event.key.toLowerCase() === "f" &&
            ui.view !== "diagnostics"
          ) {
            event.preventDefault();
            $("search").focus();
          }
          if (event.key === "Escape") $("toast").hidden = true;
        });
        function setupSidebarAccordion() {
          const nav = $("sidebarNav");
          if (!nav) return;

          // 1. Restore order from localStorage
          try {
            const savedOrder = JSON.parse(localStorage.getItem("playmelt_nav_order") || "[]");
            if (Array.isArray(savedOrder) && savedOrder.length) {
              savedOrder.forEach((secId) => {
                const sec = nav.querySelector(`.nav-section[data-section-id="${secId}"]`);
                if (sec) nav.appendChild(sec);
              });
            }
          } catch {}

          // 2. Restore collapsed states
          try {
            const savedCollapsed = JSON.parse(localStorage.getItem("playmelt_nav_collapsed") || "{}");
            if (savedCollapsed && typeof savedCollapsed === "object") {
              Object.keys(savedCollapsed).forEach((secId) => {
                const sec = nav.querySelector(`.nav-section[data-section-id="${secId}"]`);
                if (sec && savedCollapsed[secId]) sec.classList.add("collapsed");
              });
            }
          } catch {}

          function saveOrder() {
            const order = [];
            nav.querySelectorAll(".nav-section").forEach((sec) => {
              const id = sec.getAttribute("data-section-id");
              if (id) order.push(id);
            });
            try {
              localStorage.setItem("playmelt_nav_order", JSON.stringify(order));
            } catch {}
          }

          function saveCollapsed() {
            const stateObj = {};
            nav.querySelectorAll(".nav-section").forEach((sec) => {
              const id = sec.getAttribute("data-section-id");
              if (id) stateObj[id] = sec.classList.contains("collapsed");
            });
            try {
              localStorage.setItem("playmelt_nav_collapsed", JSON.stringify(stateObj));
            } catch {}
          }

          // 3. Attach event listeners
          nav.querySelectorAll(".nav-section").forEach((sec) => {
            const header = sec.querySelector(".nav-section-header");
            header?.addEventListener("click", (e) => {
              if (e.target.closest(".nav-move-btn")) return;
              sec.classList.toggle("collapsed");
              saveCollapsed();
            });

            sec.querySelectorAll(".nav-move-btn").forEach((btn) => {
              btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const dir = btn.dataset.move;
                if (dir === "up" && sec.previousElementSibling) {
                  nav.insertBefore(sec, sec.previousElementSibling);
                } else if (dir === "down" && sec.nextElementSibling) {
                  nav.insertBefore(sec.nextElementSibling, sec);
                }
                saveOrder();
              });
            });
          });
        }

        // v2 : barre latérale fixe, sans sections repliables ni réordonnables.
        render();
        send("refresh");
      })();
    </script>
  </body>
</html>
